{% extends "base.html" %}

{% block title %}Resources{% endblock %}

{% block content %}
<header>
  <h1>Resources</h1>
</header>

<main>
  <form id="resourceForm">
    <input type="text" id="hospital" placeholder="Hospital" required>
    <input type="number" id="beds" placeholder="Beds" required>
    <input type="number" id="ventilators" placeholder="Ventilators" required>
    <input type="text" id="status" placeholder="Status" required>
    <button type="submit">Add Resource</button>
  </form>
  <button id="getResources">Get Resources</button>
  <div id="output"></div>
</main>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('resourceForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = {
    hospital: document.getElementById('hospital').value,
    beds: parseInt(document.getElementById('beds').value),
    ventilators: parseInt(document.getElementById('ventilators').value),
    status: document.getElementById('status').value
  };
  try {
    const res = await fetch('http://127.0.0.1:8000/resources', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await res.json();
    document.getElementById('output').innerHTML = `<p>${result.msg}</p>`;
  } catch (err) {
    document.getElementById('output').innerHTML = `<p>Error: ${err.message}</p>`;
  }
});

document.getElementById('getResources').addEventListener('click', async () => {
  try {
    const res = await fetch('http://127.0.0.1:8000/resources');
    const data = await res.json();
    document.getElementById('output').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
  } catch (err) {
    document.getElementById('output').innerHTML = `<p>Error: ${err.message}</p>`;
  }
});
</script>
{% endblock %}
