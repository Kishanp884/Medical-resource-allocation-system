{% extends "base.html" %}

{% block title %}IV Monitoring{% endblock %}

{% block content %}
<header>
  <h1>IV Monitoring</h1>
</header>

<main>
  <form id="ivForm">
    <input type="text" id="patient_id" placeholder="Patient ID" required>
    <input type="number" step="0.01" id="flow_rate" placeholder="Flow Rate" required>
    <input type="number" step="0.01" id="volume" placeholder="Volume" required>
    <button type="submit">Add IV Data</button>
  </form>
  <button id="getIV">Get IV Data</button>
  <div id="output"></div>
</main>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('ivForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = {
    patient_id: document.getElementById('patient_id').value,
    flow_rate: parseFloat(document.getElementById('flow_rate').value),
    volume: parseFloat(document.getElementById('volume').value)
  };
  try {
    const res = await fetch('http://127.0.0.1:8000/iv', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await res.json();
    document.getElementById('output').innerHTML = `<p>${result.msg}</p>`;
  } catch (err) {
    document.getElementById('output').innerHTML = `<p>Error: ${err.message}</p>`;
  }
});

document.getElementById('getIV').addEventListener('click', async () => {
  try {
    const res = await fetch('http://127.0.0.1:8000/iv');
    const data = await res.json();
    document.getElementById('output').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
  } catch (err) {
    document.getElementById('output').innerHTML = `<p>Error: ${err.message}</p>`;
  }
});
</script>
{% endblock %}
